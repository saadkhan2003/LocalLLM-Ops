global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8747"]
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      # Point this at the vLLM host after you start it. Left as a placeholder.
      - targets: ["host.docker.internal:8000"]
