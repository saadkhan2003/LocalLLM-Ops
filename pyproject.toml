[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localllm-ops"
version = "0.1.0"
description = "Fine-tune, evaluate, quantize, and serve a small text-to-SQL model on Spider."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Muhammad Saad Khan" }]
keywords = ["llm", "fine-tuning", "vllm", "text-to-sql", "mlops"]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "prometheus-client>=0.21",
  "prometheus-fastapi-instrumentator>=7.0",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "sqlglot>=25.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["locust>=2.32", "pytest>=8.3", "ruff>=0.8"]
data = ["datasets>=3.0"]
train = [
  "accelerate>=1.0",
  "bitsandbytes>=0.44",
  "mlflow>=2.16",
  "peft>=0.13",
  "torch>=2.4",
  "transformers>=4.46",
  "trl>=0.12",
]
observe = ["langfuse>=2.50"]
cloud = ["modal>=0.73"]

[project.scripts]
localllm-prep = "localllm.data.prep_spider:main"
localllm-train = "localllm.train.sft:main"
localllm-eval = "localllm.eval.harness:main"
localllm-baseline = "localllm.eval.baseline:main"
localllm-gateway = "localllm.gateway.app:main"
localllm-awq = "localllm.quant.awq:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localllm"]

[tool.hatch.build.targets.wheel.sources]
"src/localllm" = "localllm"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "deploy", "loadtest"]
extend-exclude = ["notebooks", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E501"]
"src/localllm/gateway/page.py" = ["E501"]
"src/localllm/eval/render_tables.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
