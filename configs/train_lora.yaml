model_name: Qwen/Qwen2.5-1.5B-Instruct
method: lora
output_dir: outputs/lora
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
train:
  learning_rate: 2.0e-4
  num_train_epochs: 3
  max_seq_length: 1024
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  bf16: true
  fp16: false
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  max_steps: -1
  seed: 42
  assistant_only_loss: true
data:
  train_jsonl: data/spider/train.jsonl
  val_jsonl: data/spider/val.jsonl
  max_train_examples: null
mlflow:
  tracking_uri: file:./mlruns
  experiment_name: localllm-ops
qlora:
  load_in_4bit: false
