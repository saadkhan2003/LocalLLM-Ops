# Free T4 (Kaggle or Colab) is 16 GB and does not reliably do bf16.
# 50 steps is the smoke length. Remove max_steps for the full run.
model_name: Qwen/Qwen2.5-1.5B-Instruct
method: qlora
output_dir: outputs/qlora-t4
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
train:
  learning_rate: 2.0e-4
  num_train_epochs: 1
  max_seq_length: 1024
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  bf16: false
  fp16: true
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  max_steps: 50
  seed: 42
  assistant_only_loss: true
data:
  train_jsonl: data/spider_small/train.jsonl
  val_jsonl: data/spider_small/val.jsonl
  max_train_examples: 200
mlflow:
  tracking_uri: file:./mlruns
  experiment_name: localllm-ops-t4
qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
